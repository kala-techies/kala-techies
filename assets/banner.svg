<svg width="1200" height="170" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering pipeline: Git, GitHub Actions, Build and Test, Container, Azure, AKS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#0f1b33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2b45" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="170" fill="url(#bg)"/>
  <rect width="1200" height="170" fill="url(#grid)" opacity="0.5"/>
  <rect x="0.5" y="0.5" width="1199" height="169" fill="none" stroke="#22314f" stroke-width="1"/>

  <!-- Pipeline flow: Git -> Actions -> Build/Test -> Container -> Azure -> AKS -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <line x1="80" y1="85" x2="1120" y2="85" stroke="#26334f" stroke-width="2"/>

    <circle r="4" fill="#38bdf8">
      <animateMotion dur="5s" repeatCount="indefinite" path="M80,85 L1120,85"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.9;1" dur="5s" repeatCount="indefinite"/>
    </circle>

    <g font-size="13" fill="#9db2d8">
      <g>
        <circle cx="80" cy="85" r="7" fill="#0f1b33" stroke="#38bdf8" stroke-width="2"/>
        <text x="80" y="112" text-anchor="middle">Git</text>
      </g>
      <g>
        <circle cx="288" cy="85" r="7" fill="#0f1b33" stroke="#38bdf8" stroke-width="2"/>
        <text x="288" y="112" text-anchor="middle">Actions</text>
      </g>
      <g>
        <circle cx="496" cy="85" r="7" fill="#0f1b33" stroke="#38bdf8" stroke-width="2"/>
        <text x="496" y="112" text-anchor="middle">Build / Test</text>
      </g>
      <g>
        <circle cx="704" cy="85" r="7" fill="#0f1b33" stroke="#38bdf8" stroke-width="2"/>
        <text x="704" y="112" text-anchor="middle">Container</text>
      </g>
      <g>
        <circle cx="912" cy="85" r="7" fill="#0f1b33" stroke="#22d3ee" stroke-width="2"/>
        <text x="912" y="112" text-anchor="middle">Azure</text>
      </g>
      <g>
        <circle cx="1120" cy="85" r="7" fill="#0f1b33" stroke="#22d3ee" stroke-width="2"/>
        <text x="1120" y="112" text-anchor="middle">AKS</text>
      </g>
    </g>
  </g>
</svg>

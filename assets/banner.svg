<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kalandar — Cloud and DevOps Engineer. Azure, Kubernetes, AKS, Infrastructure Automation, CI/CD.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2b45" stroke-width="1"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" values="0;520;520;520;0;0" keyTimes="0;0.32;0.75;0.82;0.92;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0 0 1 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)" opacity="0.5"/>
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#22314f" stroke-width="1"/>

  <!-- Pipeline flow: Git -> Actions -> Build -> Container -> Azure -> AKS -->
  <g transform="translate(760,190)" font-family="Segoe UI, Arial, sans-serif">
    <path d="M0,20 L400,20" stroke="#26334f" stroke-width="2" fill="none"/>
    <g>
      <circle r="4" fill="#38bdf8">
        <animateMotion dur="4s" repeatCount="indefinite" path="M0,20 L400,20"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g font-size="11" fill="#7d92b8">
      <circle cx="0" cy="20" r="5" fill="#0f1b33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="42" text-anchor="middle">Git</text>

      <circle cx="80" cy="20" r="5" fill="#0f1b33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="80" y="42" text-anchor="middle">Actions</text>

      <circle cx="160" cy="20" r="5" fill="#0f1b33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="160" y="42" text-anchor="middle">Build/Test</text>

      <circle cx="240" cy="20" r="5" fill="#0f1b33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="240" y="42" text-anchor="middle">Container</text>

      <circle cx="320" cy="20" r="5" fill="#0f1b33" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="320" y="42" text-anchor="middle">Azure</text>

      <circle cx="400" cy="20" r="5" fill="#0f1b33" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="400" y="42" text-anchor="middle">AKS</text>
    </g>
  </g>

  <!-- Text block -->
  <g transform="translate(60,80)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="0" font-size="42" font-weight="700" fill="#f4f7fb">Kalandar</text>

    <g clip-path="url(#typeClip)">
      <text x="0" y="42" font-size="24" font-weight="600" fill="url(#accent)">Cloud &amp; DevOps Engineer</text>
    </g>
    <rect x="0" y="14" width="3" height="26" fill="#38bdf8">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.5;0.7;1" dur="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;520,0;520,0" keyTimes="0;0.32;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="0" y="78" font-size="14" fill="#8ea3c9" letter-spacing="0.5">Azure&#160;&#160;·&#160;&#160;Kubernetes&#160;&#160;·&#160;&#160;AKS&#160;&#160;·&#160;&#160;Infrastructure Automation&#160;&#160;·&#160;&#160;CI/CD</text>
  </g>
</svg>
